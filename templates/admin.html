<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin Logs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container container-wide">
    <h2>📋 Detection Logs</h2>
    
    <div class="nav-section">
      <a href="/" class="nav-link">🏠 Home</a> | 
      <a href="/admin/export_csv" class="nav-link">⬇️ Export CSV</a> |
      <a href="/logout" class="nav-link" style="color: #dc3545;">🚪 Logout</a>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 50px;">ID</th>
          <th style="width: 150px;">Time</th>
          <th>Text Content</th>
          <th style="width: 100px;">Type</th>
          <th style="width: 80px;">Score</th>
          <th style="width: 150px;">Status</th>
        </tr>
      </thead>
      <tbody>
        {% for row in logs %}
        <tr>
          <td>{{ row.id }}</td>
          <td style="color: #666; font-size: 0.9em;">{{ row.time }}</td>
          <td>{{ row.text }}</td>
          <td>{{ row.type|capitalize }}</td>
          <td>{{ "%.2f"|format(row.score * 100) }}%</td>
          
          <td>
            <span class="badge bg-{{ row.status_code }}">
                {{ row.status_text }}
            </span>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
